<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<rect width="900" height="420" fill="white"/>
<polygon points="450,40 330,140 570,140" fill="#ffd9b3" stroke="#2b3a4a" stroke-width="2"/><text x="450" y="110" text-anchor="middle" font-size="14" fill="#2b3a4a" font-weight="bold">官方号×1 给AI看</text><polygon points="330,150 570,150 620,240 280,240" fill="#fff3e6" stroke="#2b3a4a" stroke-width="2"/><text x="450" y="200" text-anchor="middle" font-size="15" fill="#2b3a4a" font-weight="bold">专家IP号×1~2 做信任</text><polygon points="280,250 620,250 680,350 220,350" fill="#eef1f5" stroke="#2b3a4a" stroke-width="2"/><text x="450" y="300" text-anchor="middle" font-size="15" fill="#2b3a4a" font-weight="bold">产品号×3~5 冲询盘 + 地域号×1~3 截本地</text><g stroke="#2b3a4a" stroke-width="2.7" fill="none" stroke-linecap="round"><circle cx="770" cy="160" r="12.6"/><line x1="770" y1="172.6" x2="770" y2="199.6"/><line x1="755.6" y1="188.79999999999998" x2="784.4" y2="188.79999999999998"/><line x1="770" y1="199.6" x2="759.2" y2="221.2"/><line x1="770" y1="199.6" x2="780.8" y2="221.2"/></g><text x="770" y="239.2" text-anchor="middle" font-size="15" fill="#2b3a4a">AI 跨账号</text><text x="770" y="258" text-anchor="middle" font-size="14" fill="#2b3a4a" >交叉验证</text><line x1="720" y1="200" x2="640" y2="180" stroke="#8a94a3" stroke-width="3" stroke-dasharray="5 4"/><polygon points="640,180 651.8560988387289,178.14718583600774 649.5893511334704,187.2141766570421" fill="#8a94a3"/><line x1="720" y1="220" x2="660" y2="280" stroke="#8a94a3" stroke-width="3" stroke-dasharray="5 4"/><polygon points="660,280 664.5111374901719,268.8802140962712 671.1197859037288,275.4888625098281" fill="#8a94a3"/><text x="450" y="400" text-anchor="middle" font-size="15" fill="#b5432e" font-weight="bold">单账号无法完成证据链闭环 —— 矩阵的意义是让 AI 从不同账号验证同一套事实</text></svg>