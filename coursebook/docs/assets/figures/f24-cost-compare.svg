<text x="450" y="40" text-anchor="middle" font-size="20" fill="#2b3a4a" font-weight="bold">算一笔账：12 周内容产能，人工 vs AI 员工</text><line x1="120" y1="330" x2="820" y2="330" stroke="#2b3a4a" stroke-width="3"/><rect x="200" y="90" width="150" height="240" rx="8" fill="#b5432e" opacity="0.85"/><text x="275" y="80" text-anchor="middle" font-size="20" fill="#b5432e" font-weight="bold">≈ 1.5 万元</text><text x="275" y="360" text-anchor="middle" font-size="15" fill="#2b3a4a" font-weight="bold">人工写 60 篇</text><text x="275" y="382" text-anchor="middle" font-size="12" fill="#8a94a3" >200~300 元/篇 × 3 小时/篇</text><rect x="550" y="318" width="150" height="12" rx="4" fill="#3f7d4e"/><text x="625" y="300" text-anchor="middle" font-size="20" fill="#3f7d4e" font-weight="bold">≈ 180 元</text><text x="625" y="360" text-anchor="middle" font-size="15" fill="#2b3a4a" font-weight="bold">AI 员工写 60 篇</text><text x="625" y="382" text-anchor="middle" font-size="12" fill="#8a94a3" >2~3 元/篇 · 老板只审事实</text><g stroke="#ff5f00" stroke-width="2.7" fill="none" stroke-linecap="round"><circle cx="460" cy="180" r="12.6"/><line x1="460" y1="192.6" x2="460" y2="219.6"/><line x1="460" y1="205.2" x2="483.4" y2="194.4"/><line x1="460" y1="205.2" x2="447.4" y2="212.4"/><line x1="460" y1="219.6" x2="449.2" y2="241.2"/><line x1="460" y1="219.6" x2="470.8" y2="241.2"/></g><rect x="390" y="255" width="140" height="50" rx="12" fill="white" stroke="#8a94a3" stroke-width="2"/><text x="460.0" y="285.25" text-anchor="middle" font-size="15" fill="#2b3a4a">差 80 倍</text></svg>