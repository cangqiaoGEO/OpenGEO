<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><title>Browser collector fixture</title></head>
  <body>
    <textarea id="prompt"></textarea>
    <button id="send" type="button">发送</button>
    <main id="answers"></main>
    <script>
      const renderAnswer = () => {
        document.querySelector("#answers").innerHTML = '<article class="answer">固定 Mock 回答<a class="citation" href="https://example.com/source">来源</a></article>'
      }
      document.querySelector("#send").addEventListener("click", renderAnswer)
      document.querySelector("#prompt").addEventListener("keydown", (event) => {
        if (event.key === "Enter") renderAnswer()
      })
    </script>
  </body>
</html>
